<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursive Topic List</title>
<style>
.App {
  font-family: sans-serif;
  text-align: center;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const topics = [
  {
    title: "Physics",
    enabled: true,
    subtopics: [
      {
        title: "Classical Mechanics",
        enabled: true,
        subtopics: [
          { title: "Kinematics", enabled: true, subtopics: [] },
          { title: "Dynamics", enabled: false, subtopics: [] },
        ],
      },
      {
        title: "Quantum Physics",
        enabled: false,
        subtopics: [
          {
            title: "Quantum Field Theory",
            enabled: true,
            subtopics: [
              { title: "Quantum Electrodynamics", enabled: true, subtopics: [] },
            ],
          },
        ],
      },
    ],
  },
  {
    title: "Mathematics",
    enabled: true,
    subtopics: [
      { title: "Algebra", enabled: true, subtopics: [] },
      {
        title: "Calculus",
        enabled: true,
        subtopics: [
          { title: "Differential Equations", enabled: false, subtopics: [] },
          { title: "Integrals", enabled: true, subtopics: [] },
        ],
      },
    ],
  },
  {
    title: "Chemistry",
    enabled: false,
    subtopics: [
      {
        title: "Organic Chemistry",
        enabled: true,
        subtopics: [{ title: "Hydrocarbons", enabled: true, subtopics: [] }],
      },
      { title: "Inorganic Chemistry", enabled: true, subtopics: [] },
    ],
  },
  { title: "Biology", enabled: true, subtopics: [] },
];

function TopicItem({ topic }) {
  const [isExpanded, setIsExpanded] = useState(false);

  const onClick = () => setIsExpanded(!isExpanded);

  return (
    <li>
      <p
        onClick={onClick}
        aria-expanded={isExpanded}
        style={{ backgroundColor: topic.enabled ? "aliceblue" : "pink" }}
      >
        {topic.title}
        {topic.subtopics.length > 0 && <span> ({topic.subtopics.length})</span>}
      </p>
      {isExpanded && topic.subtopics.length > 0 && (
        <ul>
          {topic.subtopics.map((subtopic) => (
            <TopicItem key={subtopic.title} topic={subtopic} />
          ))}
        </ul>
      )}
    </li>
  );
}

function App() {
  return (
    <div className="App">
      <ul>
        {topics.map((topic) => (
          <TopicItem key={topic.title} topic={topic} />
        ))}
      </ul>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
